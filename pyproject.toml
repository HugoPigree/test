[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twitch-autoclip"
version = "0.1.0"
description = "Enregistre un live Twitch, détecte les pics de chat et exporte des clips verticaux sous-titrés prêts pour TikTok."
requires-python = ">=3.11"
dependencies = [
    "streamlink>=6.0",
    "requests>=2.28",
    "yt-dlp>=2025.1",  # autoclip top : téléchargement des clips Twitch
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=7"]

[project.scripts]
autoclip = "autoclip.cli:main"

[tool.setuptools]
packages = ["autoclip"]
